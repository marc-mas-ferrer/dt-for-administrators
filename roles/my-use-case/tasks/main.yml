---

- include_role:
    name: k3s

- include_role:
    name: dt-access-token
  vars:
    access_token_var_name: "dt_access_token_name"
    access_token_scope: ["settings.read", "settings.write", "WriteConfig", "ExternalSyntheticIntegration"]

# --------------------------------------------------------------------
# Enable Runtime Application Protection
# --------------------------------------------------------------------
- name: Enable Runtime Application Protection
  uri:
    url: "{{ dynatrace_tenant_url }}/api/v2/settings/objects"
    method: POST
    headers:
      accept: "application/json"
      Content-Type: "application/json; charset=utf-8"
      Authorization: "Api-Token {{ dt_access_token_name }}"
    body: "{{ lookup('file', role_path + '/files/app_protection.json') }}"
    body_format: json
    status_code: 200

# --------------------------------------------------------------------
# Creation of Unguard web application
# --------------------------------------------------------------------
- name: Create unguard web application
  uri:
    url: "{{ dynatrace_tenant_url }}/api/config/v1/applications/web"
    method: POST
    headers:
      accept: "application/json"
      Content-Type: "application/json; charset=utf-8"
      Authorization: "Api-Token {{ dt_access_token_name }}"
    body: "{{ lookup('file', role_path + '/files/unguard_webapp.json.j2') }}"
    body_format: json
    status_code: [200, 201]
  register: unguard_webapp_result

- debug:
    msg: "Created app ID: {{ unguard_webapp_result.json.id }}"  
  
- name: Pause for 1 Minute
  ansible.builtin.pause:
    minutes: 1

# --------------------------------------------------------------------
# Configuration of of Unguard web application detection rule
# --------------------------------------------------------------------
- name: Configure app detection rules
  uri:
    url: "{{ dynatrace_tenant_url }}/api/v2/settings/objects"
    method: POST
    headers:
      accept: "application/json"
      Content-Type: "application/json; charset=utf-8"
      Authorization: "Api-Token {{ dt_access_token_name }}"
    body: "{{ lookup('template', role_path + '/files/app_detection.json.j2') }}"
    body_format: json
    status_code: [200, 201]   

- name: Pause for 1 Minute
  ansible.builtin.pause:
    minutes: 1   

# --------------------------------------------------------------------
# Creation of Unguard management zone
# --------------------------------------------------------------------
- name: Configure management zone
  uri:
    url: "{{ dynatrace_tenant_url }}/api/v2/settings/objects"
    method: POST
    headers:
      accept: "application/json"
      Content-Type: "application/json; charset=utf-8"
      Authorization: "Api-Token {{ dt_access_token_name }}"
    body: "{{ lookup('file', role_path + '/files/mz_unguard.json') }}"
    body_format: json
    status_code: [200, 201]

# --------------------------------------------------------------------
# Log storage settings - Enable log ingestion
# --------------------------------------------------------------------
- name: Get log storage settings object
  uri:
    url: "{{ dynatrace_tenant_url }}/api/v2/settings/objects?schemaIds=builtin%3Alogmonitoring.log-storage-settings&scopes=environment&fields=objectId%2C%20value&filter=value.config-item-title%20%3D%20%27%5BBuilt-in%5D%20Ingest%20all%20logs%27&adminAccess=false"
    method: GET
    headers:
      accept: "application/json; charset=utf-8"
      Authorization: "Api-Token {{ dt_access_token_name }}"
    return_content: yes
  register: log_storage_response

- debug:
    msg: "type: {{ log_storage_response.json.__class__.__name__ }} | content: {{ log_storage_response.json }}"

- debug:
    msg: "keys: {{ log_storage_response.keys() }}"

- name: Extract log storage object ID
  set_fact:
    log_storage_object_id: "{{ log_storage_response.json['items'][0]['objectId'] }}"

- name: Enable log storage ingestion
  uri:
    url: "{{ dynatrace_tenant_url }}/api/v2/settings/objects/{{ log_storage_object_id }}"
    method: PUT
    headers:
      accept: "application/json; charset=utf-8"
      Content-Type: "application/json; charset=utf-8"
      Authorization: "Api-Token {{ dt_access_token_name }}"
    body: "{{ lookup('file', role_path + '/files/log_storage_enable.json') }}"
    body_format: json
    status_code: [200]
  register: log_storage_update_result

- include_role:
    name: dt-operator
  vars:
    operator_mode: "cloudNativeFullStack"
    log_monitoring: "oneagent"
    dt_operator_release: "v1.7.3"

- name: Pause for 1 Minute
  ansible.builtin.pause:
    minutes: 1

- include_role:
    name: app-easytrade

- include_role:
    name: app-unguard
  vars:
    ingress_protocol: "http"
    unguard_image_tag: "0.13.0"

- name: Pause for 1 Minute
  ansible.builtin.pause:
    minutes: 1

- include_role:
    name: dashboard
